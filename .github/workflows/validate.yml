name: Validate JSON + TypeScript

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Audit JSON & TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit JSON schema
        run: npm run audit

      - name: TypeScript check
        run: npx astro check

  build-check:
    name: Build preview
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (skip audit, already ran)
        run: npm run build:fast

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-preview
          path: dist/
          retention-days: 3
